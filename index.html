<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ertiga 7-Seater Cab | Phulera Express</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet Free Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f17; color: #f8fafc; }
    #map { height: 42vh; width: 100%; z-index: 1; }
    .bottom-sheet {
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }
    .autocomplete-box {
      position: absolute;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.75rem;
      z-index: 9999;
      width: 100%;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>

  <script>
    const OWNER_NAME = "Nand Lal Kumawat";
    const OWNER_PHONE = "9413159195";
    const OWNER_WHATSAPP = "919413159195";

    let map, pickupMarker, dropMarker, routeLayer;
    let pickupCoords = null;
    let dropCoords = null;
    let customerLiveGps = null;
    let distanceKm = 0;

    function initMap() {
      // Centered at Phulera
      map = L.map('map', { zoomControl: false }).setView([26.8719, 75.35], 10);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      map.on('click', (e) => {
        const { lat, lng } = e.latlng;
        if (!pickupCoords) setLocation('pickup', [lat, lng], "Map Pin Location");
        else setLocation('drop', [lat, lng], "Map Pin Location");
      });
    }

    // Customer Live GPS Location Fetch
    window.useCurrentLocation = () => {
      if (!navigator.geolocation) return alert("Aapke phone me location support nahi hai.");
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        customerLiveGps = { lat, lng };
        setLocation('pickup', [lat, lng], "Mera Current Live Location (GPS)");
        map.setView([lat, lng], 14);
      }, () => alert("Location permission allow kijiye taaki driver ko aapka exact pata mil sake."));
    };

    function setLocation(type, coords, name) {
      if (type === 'pickup') {
        pickupCoords = coords;
        document.getElementById('input-pickup').value = name;
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.marker(coords).addTo(map).bindPopup("Pickup: " + name);
      } else {
        dropCoords = coords;
        document.getElementById('input-drop').value = name;
        if (dropMarker) map.removeLayer(dropMarker);
        dropMarker = L.marker(coords).addTo(map).bindPopup("Drop: " + name);
      }
      buildRoute();
    }

    window.searchAddress = async (query, type) => {
      const box = document.getElementById(type === 'pickup' ? 'pickup-results' : 'drop-results');
      if (!query || query.length < 3) {
        box.classList.add('hidden');
        return;
      }

      try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5&lat=26.9124&lon=75.7873`);
        const data = await res.json();
        box.innerHTML = '';
        if (data.features && data.features.length > 0) {
          box.classList.remove('hidden');
          data.features.forEach(f => {
            const name = [f.properties.name, f.properties.city, f.properties.state].filter(Boolean).join(", ");
            const [lng, lat] = f.geometry.coordinates;
            const div = document.createElement('div');
            div.className = "px-3.5 py-2 hover:bg-slate-700 cursor-pointer text-xs border-b border-gray-700 text-slate-200";
            div.innerText = name;
            div.onclick = () => {
              setLocation(type, [lat, lng], name);
              box.classList.add('hidden');
            };
            box.appendChild(div);
          });
        }
      } catch (e) {}
    };

    async function buildRoute() {
      if (!pickupCoords || !dropCoords) return;
      if (routeLayer) map.removeLayer(routeLayer);

      const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords[1]},${pickupCoords[0]};${dropCoords[1]},${dropCoords[0]}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          distanceKm = Math.round(route.distance / 1000);
          routeLayer = L.geoJSON(route.geometry, { style: { color: '#f59e0b', weight: 5 } }).addTo(map);
          map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
          document.getElementById('route-info').innerText = `${distanceKm} km (One-Way Distance)`;
        }
      } catch (err) {
        document.getElementById('route-info').innerText = "Route Linked";
      }
    }

    // Direct WhatsApp with Mandatory Customer GPS
    window.sendToWhatsApp = () => {
      const pickup = document.getElementById('input-pickup').value.trim();
      const drop = document.getElementById('input-drop').value.trim();

      if (!pickup || !drop) return alert("Pehle Pickup aur Drop location set karein!");

      const name = document.getElementById('c-name').value.trim() || "Customer";
      const phone = document.getElementById('c-phone').value.trim();
      const date = document.getElementById('c-date').value.trim() || "Aaj / Urgent";

      if (!phone) return alert("Kripya apna mobile number likhein!");

      // Agar customer ne pehle GPS allow nahi kiya toh abhi maang lo
      if (!customerLiveGps && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          customerLiveGps = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };
          triggerWhatsAppMessage(name, phone, date, pickup, drop);
        }, () => {
          // Agar customer mana bhi kar de toh map pin wala link bhej do
          triggerWhatsAppMessage(name, phone, date, pickup, drop);
        });
      } else {
        triggerWhatsAppMessage(name, phone, date, pickup, drop);
      }
    };

    function triggerWhatsAppMessage(name, phone, date, pickup, drop) {
      const targetCoords = customerLiveGps ? [customerLiveGps.lat, customerLiveGps.lng] : (pickupCoords || [26.8719, 75.35]);
      const exactGoogleMapLink = `https://maps.google.com/?q=${targetCoords[0]},${targetCoords[1]}`;

      const text = `🚖 *ERTIGA 7-SEATER CAB BOOKING ENQUIRY*%0A` +
        `------------------------------------%0A` +
        `👤 *Customer Name:* ${encodeURIComponent(name)}%0A` +
        `📞 *Customer Phone:* ${encodeURIComponent(phone)}%0A` +
        `📅 *Time / Date:* ${encodeURIComponent(date)}%0A%0A` +
        `📍 *Pickup Address:* ${encodeURIComponent(pickup)}%0A` +
        `🏁 *Drop Destination:* ${encodeURIComponent(drop)}%0A` +
        `🛣 *One-Way Distance:* ${distanceKm ? distanceKm + ' km' : 'Direct Call'}%0A` +
        `🚘 *Vehicle Required:* Maruti Ertiga (AC 7-Seater)%0A` +
        `------------------------------------%0A` +
        `📌 *Customer Exact Live GPS Location:*%0A` +
        `${exactGoogleMapLink}%0A%0A` +
        `*Namaste Nand Lal ji, is location par gaadi ki availability aur rate confirm kijiye.*`;

      window.open(`https://wa.me/${OWNER_WHATSAPP}?text=${text}`, '_blank');
    }

    // Direct Phone Call
    window.directCall = () => {
      window.location.href = `tel:${OWNER_PHONE}`;
    };

    window.onload = initMap;
  </script>
</head>
<body class="flex flex-col items-center justify-start min-h-screen">
  <div class="w-full max-w-md min-h-screen flex flex-col relative bg-slate-950">

    <!-- Top Bar -->
    <header class="p-4 flex items-center justify-between z-10 bg-slate-900 border-b border-slate-800">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
          <i class="fa-solid fa-van-shuttle text-base"></i>
        </div>
        <div>
          <h1 class="text-sm font-black text-white">ERTIGA CAB SERVICES</h1>
          <p class="text-[10px] text-amber-400 font-semibold uppercase">Nand Lal Kumawat • 9413159195</p>
        </div>
      </div>
      <button onclick="directCall()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-phone text-xs"></i> Call Now
      </button>
    </header>

    <!-- Map -->
    <div id="map"></div>

    <!-- Booking Sheet -->
    <div class="flex-1 bottom-sheet p-5 rounded-t-3xl -mt-4 z-10 flex flex-col gap-3.5">

      <!-- Address Inputs -->
      <div class="bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 flex flex-col gap-2.5 relative">
        <div class="relative flex items-center gap-2">
          <i class="fa-solid fa-circle-dot text-amber-400 text-xs ml-1"></i>
          <input id="input-pickup" type="text" placeholder="Pickup Address (e.g. Phulera Station / Ghar)" 
                 oninput="searchAddress(this.value, 'pickup')"
                 class="w-full bg-transparent text-xs text-white font-semibold outline-none placeholder:text-slate-500">
          <button onclick="useCurrentLocation()" title="Mera Live Location Use Karo" class="text-amber-400 hover:text-amber-300 p-1 flex items-center gap-1 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/30 text-[10px] font-bold">
            <i class="fa-solid fa-crosshairs"></i> GPS
          </button>
          <div id="pickup-results" class="autocomplete-box hidden top-9 left-0"></div>
        </div>

        <div class="h-[1px] bg-slate-800 ml-5 mr-1"></div>

        <div class="relative flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-rose-500 text-xs ml-1"></i>
          <input id="input-drop" type="text" placeholder="Drop Kahan Karna Hai? (e.g. Jaipur, Ajmer, Airport)" 
                 oninput="searchAddress(this.value, 'drop')"
                 class="w-full bg-transparent text-xs text-white font-semibold outline-none placeholder:text-slate-500">
          <div id="drop-results" class="autocomplete-box hidden top-9 left-0"></div>
        </div>
      </div>

      <!-- Distance Info -->
      <div class="flex items-center justify-between px-2 text-xs">
        <span class="text-slate-400 flex items-center gap-1.5">
          <i class="fa-solid fa-route text-amber-400"></i> Route Distance:
        </span>
        <span id="route-info" class="font-bold text-amber-400 font-mono">Location select karein</span>
      </div>

      <!-- Vehicle Card -->
      <div class="p-3 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center">
            <i class="fa-solid fa-users text-sm"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-white">Maruti Ertiga (AC 7-Seater)</h4>
            <p class="text-[10px] text-slate-400">Family Cab • Outstation & Tour Specialist</p>
          </div>
        </div>
        <span class="text-[10px] font-bold bg-amber-500 text-black px-2 py-0.5 rounded-md uppercase">7 Seats</span>
      </div>

      <!-- Customer Inputs -->
      <div class="grid grid-cols-2 gap-2">
        <input id="c-name" type="text" placeholder="Aapka Naam" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-500">
        <input id="c-phone" type="tel" placeholder="Mobile Number" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-500">
      </div>
      <input id="c-date" type="text" placeholder="Kab chalna hai? (e.g. Aaj shaam 6 baje / Kal subah)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-500">

      <!-- Action Buttons -->
      <div class="flex flex-col gap-2 pt-1">
        <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl text-xs uppercase tracking-wider shadow-lg flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>Send Route & Live GPS to WhatsApp</span>
        </button>

        <button onclick="directCall()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-3 rounded-xl text-xs uppercase tracking-wider border border-slate-700 flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-phone"></i>
          <span>Direct Call: 9413159195</span>
        </button>
      </div>

    </div>
  </div>
</body>
</html>
